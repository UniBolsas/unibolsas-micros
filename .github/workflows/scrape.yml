name: scrape

on:
  schedule:
    # Todo dia a cada 6h (UTC). Ajuste se quiser outra frequência.
    - cron: "0 */6 * * *"
  workflow_dispatch: # permite disparo manual pela aba Actions

permissions:
  contents: read

# Duas execuções ao mesmo tempo confundiriam o acompanhamento do status.
concurrency:
  group: scrape

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run scrapers and report
        env:
          SCRAPE_URL: ${{ vars.SCRAPE_URL }}
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/trigger_scrape.py
